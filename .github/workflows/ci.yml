name: Extension CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run zip:all
      - name: Check version and create tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CURRENT_VERSION="v$(node -p "require('./package.json').version")"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ "$LAST_TAG" != "$CURRENT_VERSION" ]; then
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git tag "$CURRENT_VERSION"
            git push origin "$CURRENT_VERSION"
            echo "Created and pushed tag: $CURRENT_VERSION"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: apivu-extension
          path: .output/*.zip
          # WXT writes to .output/, and upload-artifact skips anything under a dot-directory unless this is set.
          include-hidden-files: true
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apivu-extension
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apivu-extension
          path: release
      - name: Check tag, package.json and zip versions match
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          ZIP=$(ls release/*-chrome.zip)
          MANIFEST=$(unzip -p "$ZIP" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "tag=$TAG package=$PKG manifest=$MANIFEST"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$MANIFEST" ] || { echo "::error::Version mismatch"; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      # Exchange the service-account key for an access token directly (JWT bearer grant). google-github-actions/auth
      # would instead impersonate the account via the IAM Credentials API, which needs the Token Creator role.
      - id: auth
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          TOKEN=$(node --input-type=module -e '
            import { createSign } from "node:crypto";
            const key = JSON.parse(process.env.SERVICE_ACCOUNT_JSON);
            const tokenUri = key.token_uri || "https://oauth2.googleapis.com/token";
            const now = Math.floor(Date.now() / 1000);
            const b64 = (value) => Buffer.from(JSON.stringify(value)).toString("base64url");
            const unsigned = `${b64({ alg: "RS256", typ: "JWT" })}.${b64({
              iss: key.client_email,
              scope: "https://www.googleapis.com/auth/chromewebstore",
              aud: tokenUri,
              iat: now,
              exp: now + 3600,
            })}`;
            const signature = createSign("RSA-SHA256").update(unsigned).sign(key.private_key, "base64url");
            const res = await fetch(tokenUri, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({ grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: `${unsigned}.${signature}` }),
            });
            const body = await res.json();
            if (!res.ok || !body.access_token) {
              console.error(`Token request failed (${res.status}): ${body.error ?? ""} ${body.error_description ?? ""}`);
              process.exit(1);
            }
            console.log(body.access_token);
          ')
          echo "::add-mask::$TOKEN"
          echo "access_token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Upload to Chrome Web Store
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          ITEM="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          RES=$(curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -T "$ZIP" \
            "https://chromewebstore.googleapis.com/upload/v2/$ITEM:upload")
          echo "$RES"
          STATE=$(echo "$RES" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).uploadState")
          for i in 1 2 3 4 5 6; do
            [ "$STATE" = "IN_PROGRESS" ] || break
            sleep 10
            RES=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
              "https://chromewebstore.googleapis.com/v2/$ITEM:fetchStatus")
            echo "$RES"
            STATE=$(echo "$RES" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).lastAsyncUploadState || 'IN_PROGRESS'")
          done
          [ "$STATE" = "SUCCEEDED" ] || [ "$STATE" = "SUCCESS" ] || { echo "::error::Upload state: $STATE"; exit 1; }
      - name: Submit for review
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Length: 0" \
            "https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID:publish"

  publish-edge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apivu-extension
          path: release
      - name: Check tag, package.json and zip versions match
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          ZIP=$(ls release/*-edge.zip)
          MANIFEST=$(unzip -p "$ZIP" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "tag=$TAG package=$PKG manifest=$MANIFEST"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$MANIFEST" ] || { echo "::error::Version mismatch"; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Upload to Microsoft Edge Add-ons
        run: |
          set -euo pipefail
          API="https://api.addons.microsoftedge.microsoft.com/v1/products/$EDGE_PRODUCT_ID"
          AUTH=(-H "Authorization: ApiKey $EDGE_API_KEY" -H "X-ClientID: $EDGE_CLIENT_ID")

          # Operations are asynchronous: the Location header carries the operation id, which is polled until it finishes.
          poll() {
            for i in $(seq 1 30); do
              RES=$(curl -fsS "${AUTH[@]}" "$1")
              echo "$RES"
              STATUS=$(echo "$RES" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).status")
              case "$STATUS" in
                InProgress) sleep 10 ;;
                Succeeded) return 0 ;;
                *) return 1 ;;
              esac
            done
            return 1
          }
          operation_id() { tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}' | sed 's#.*/##'; }

          OP=$(curl -fsS -D - -o /dev/null -X POST "${AUTH[@]}" \
            -H "Content-Type: application/zip" --data-binary "@$ZIP" \
            "$API/submissions/draft/package" | operation_id)
          [ -n "$OP" ] || { echo "::error::No operation id returned for upload"; exit 1; }
          poll "$API/submissions/draft/package/operations/$OP" || { echo "::error::Upload did not succeed"; exit 1; }

          OP=$(curl -fsS -D - -o /dev/null -X POST "${AUTH[@]}" \
            -H "Content-Type: application/json" -d "{\"notes\": \"Release $GITHUB_REF_NAME\"}" \
            "$API/submissions" | operation_id)
          [ -n "$OP" ] || { echo "::error::No operation id returned for publish"; exit 1; }
          poll "$API/submissions/operations/$OP" || { echo "::error::Submission did not succeed"; exit 1; }
